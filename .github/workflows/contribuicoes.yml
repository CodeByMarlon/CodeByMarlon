name: Atualizar contribuições

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gerar_contribuicoes.py
      - .github/workflows/contribuicoes.yml

permissions:
  contents: write

concurrency:
  group: contribuicoes
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar assets/contribuicoes.svg
        run: python scripts/gerar_contribuicoes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar se mudou
        run: |
          if git diff --quiet -- assets/contribuicoes.svg; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribuicoes.svg
          git commit -m "chore: atualiza o gráfico de contribuições"
          git push

name: Atualizar gráficos do perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gerar_contribuicoes.py
      - .github/workflows/contribuicoes.yml

permissions:
  contents: write

concurrency:
  group: contribuicoes
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar os calendários de contribuições (pt, en, de)
        run: python scripts/gerar_contribuicoes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar os calendários se mudaram
        run: |
          if git diff --quiet -- assets; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribuicoes*.svg
          git commit -m "chore: atualiza o gráfico de contribuições"
          git push

      # Cobrinha que "come" o calendário de contribuições, nas cores do perfil.
      - name: Gerar a cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-clara.svg?palette=github-light&color_snake=#0E7490&color_dots=#EBEDF0,#A5F3FC,#67E8F9,#06B6D4,#0E7490
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#0B4F5E,#0E7490,#06B6D4,#67E8F9

      # Vai para o branch "output" (sobrescrito a cada execução), para não inchar o histórico do main.
      - name: Publicar a cobrinha no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

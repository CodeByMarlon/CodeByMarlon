    <circle cx="84" cy="290" r="24" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-opacity=".5"/>
    <g transform="translate(84 290)"><path d="M0-12l10 4v6c0 7-4 11-10 14-6-3-10-7-10-14v-6z" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linejoin="round"/><path d="M-4 1l3 3 6-6" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="120" y="297" font-size="19" font-weight="700" fill="#F1F5F9">Segurança e LGPD</text>
    <text x="64" y="346" font-size="16" fill="#CBD5E1">RBAC, 2FA e criptografia</text>
    <text x="64" y="370" font-size="16" fill="#94A3B8">auditoria e privacidade</text>
  </g>
  <g class="sans ent" style="animation-delay:0.45s">
    <rect x="344" y="244" width="288" height="148" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="388" cy="290" r="24" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".5"/>
    <g transform="translate(388 290)"><path d="M0-13 3-3 13 0 3 3 0 13-3 3-13 0-3-3z" fill="#F472B6"/></g>
    <text x="424" y="297" font-size="19" font-weight="700" fill="#F1F5F9">IA aplicada</text>
    <text x="368" y="346" font-size="16" fill="#CBD5E1">Claude Code, MCPs, agentes</text>
    <text x="368" y="370" font-size="16" fill="#94A3B8">LLMs com auditoria</text>
  </g>
  <g class="sans ent" style="animation-delay:0.53s">
    <rect x="648" y="244" width="288" height="148" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="692" cy="290" r="24" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".5"/>
    <g transform="translate(692 290)"><path d="M9-6A10 10 0 1 0 10 3" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/><path d="M5-9l5 3-2 5" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="728" y="297" font-size="19" font-weight="700" fill="#F1F5F9">Métodos ágeis</text>
    <text x="672" y="346" font-size="16" fill="#CBD5E1">XP e Scrum na prática</text>
    <text x="672" y="370" font-size="16" fill="#94A3B8">entregas pequenas e contínuas</text>
  </g>
  <g class="sans ent" style="animation-delay:0.61s">
    <rect x="952" y="244" width="288" height="148" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="996" cy="290" r="24" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/>
    <g transform="translate(996 290)"><circle cx="-3" cy="-3" r="7.5" fill="none" stroke="#FBBF24" stroke-width="2.4"/><path d="M3 3l8 8" stroke="#FBBF24" stroke-width="2.6" stroke-linecap="round"/></g>
    <text x="1032" y="297" font-size="19" font-weight="700" fill="#F1F5F9">Engenharia reversa</text>
    <text x="976" y="346" font-size="16" fill="#CBD5E1">descompilação e análise</text>
    <text x="976" y="370" font-size="16" fill="#94A3B8">de binários e APIs web</text>

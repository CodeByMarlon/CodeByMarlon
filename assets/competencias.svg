<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Competências</title>
  <desc id="desc">Back-end Python com Django, DRF e Celery; tempo real e geodados; dados e ETL; DevOps e CI/CD; segurança e LGPD; IA aplicada com Claude Code, MCPs e agentes; métodos ágeis com XP e Scrum; engenharia reversa e descompilação.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
    .ent{animation:ent .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes ent{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.ent{animation:none}.mov{display:none}}
  </style>
  <rect x="1" y="1" width="1278" height="418" rx="20" fill="#0B1222" stroke="#1E293B" stroke-width="2"/>
  <text x="40" y="54" class="sans" font-size="26" font-weight="700" fill="#F1F5F9">Áreas de atuação</text>
  <text x="1240" y="54" class="mono" font-size="16" fill="#64748B" text-anchor="end">do requisito à produção</text>
  <g class="sans ent" style="animation-delay:0.05s">
    <rect x="40" y="80" width="288" height="148" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="84" cy="126" r="24" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".5"/>
    <g transform="translate(84 126)"><text y="7" font-size="19" font-weight="700" text-anchor="middle" class="mono" fill="#22D3EE">{ }</text></g>
    <text x="120" y="133" font-size="19" font-weight="700" fill="#F1F5F9">Back-end Python</text>
    <text x="64" y="182" font-size="16" fill="#CBD5E1">Django, DRF e Celery</text>
    <text x="64" y="206" font-size="16" fill="#94A3B8">sistemas modulares e APIs</text>
  </g>
  <g class="sans ent" style="animation-delay:0.13s">
    <rect x="344" y="80" width="288" height="148" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="388" cy="126" r="24" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".5"/>
    <g transform="translate(388 126)"><path d="M-13 0h6l3-8 5 16 3-8h9" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="424" y="133" font-size="19" font-weight="700" fill="#F1F5F9">Tempo real e geo</text>
    <text x="368" y="182" font-size="16" fill="#CBD5E1">WebSocket e mapas ao vivo</text>
    <text x="368" y="206" font-size="16" fill="#94A3B8">telemetria GPS e roteamento</text>
  </g>
  <g class="sans ent" style="animation-delay:0.21s">

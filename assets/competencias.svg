    <text x="976" y="182" font-size="16" fill="#CBD5E1">Docker e GitHub Actions</text>
    <text x="976" y="206" font-size="16" fill="#94A3B8">testes, staging e deploy</text>
  </g>
  <g class="sans ent" style="animation-delay:0.37s">

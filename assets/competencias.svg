    <circle cx="692" cy="126" r="24" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/>
    <g transform="translate(692 126)"><g fill="none" stroke="#FBBF24" stroke-width="2.2"><ellipse cx="0" cy="-7" rx="10" ry="4"/><path d="M-10-7v14c0 2.2 4.5 4 10 4s10-1.8 10-4V-7M-10 0c0 2.2 4.5 4 10 4s10-1.8 10-4"/></g></g>
    <text x="728" y="133" font-size="19" font-weight="700" fill="#F1F5F9">Dados e ETL</text>
    <text x="672" y="182" font-size="16" fill="#CBD5E1">PostgreSQL, pandas, Polars</text>
    <text x="672" y="206" font-size="16" fill="#94A3B8">ETL com simulação e reversão</text>
  </g>
  <g class="sans ent" style="animation-delay:0.29s">

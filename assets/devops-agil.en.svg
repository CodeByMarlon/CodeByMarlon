<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="titulo desc">
  <title id="titulo">DevOps, CI/CD and agile methods</title>
  <desc id="desc">Delivery pipeline: conventional commits, pull request with code review, CI with tests and audits, staging, automated production deploys and operations with monitoring and backups. XP practices and the Scrum cycle.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
    .ent{animation:ent .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes ent{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.ent{animation:none}.mov{display:none}}
  </style>
  <rect x="1" y="1" width="1278" height="478" rx="20" fill="#0B1222" stroke="#1E293B" stroke-width="2"/>
  <text x="40" y="54" class="sans" font-size="26" font-weight="700" fill="#F1F5F9">From commit to production</text>
  <text x="1240" y="54" class="mono" font-size="16" fill="#64748B" text-anchor="end">built with the team</text>
  <text x="40" y="96" class="sans" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1.6">DELIVERY PIPELINE</text>
  <g class="sans ent" style="animation-delay:0.05s">
    <rect x="40" y="110" width="170" height="88" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="64" cy="136" r="13" fill="#22D3EE" fill-opacity=".15" stroke="#22D3EE"/>
    <text x="64" y="141" font-size="13" font-weight="700" fill="#22D3EE" text-anchor="middle">1</text>
    <text x="86" y="142" font-size="18" font-weight="600" fill="#F1F5F9">Commit</text>
    <text x="56" y="178" font-size="14" fill="#94A3B8">conventional format</text>
  </g>
  <path d="M216 154H240M234 149l6 5-6 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sans ent" style="animation-delay:0.13s">
    <rect x="246" y="110" width="170" height="88" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="270" cy="136" r="13" fill="#60A5FA" fill-opacity=".15" stroke="#60A5FA"/>
    <text x="270" y="141" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="middle">2</text>
    <text x="292" y="142" font-size="18" font-weight="600" fill="#F1F5F9">Pull request</text>
    <text x="262" y="178" font-size="14" fill="#94A3B8">code review</text>
  </g>
  <path d="M422 154H446M440 149l6 5-6 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sans ent" style="animation-delay:0.21s">
    <rect x="452" y="110" width="170" height="88" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="476" cy="136" r="13" fill="#A78BFA" fill-opacity=".15" stroke="#A78BFA"/>
    <text x="476" y="141" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">3</text>
    <text x="498" y="142" font-size="18" font-weight="600" fill="#F1F5F9">CI</text>
    <text x="468" y="178" font-size="14" fill="#94A3B8">tests and audits</text>
  </g>
  <path d="M628 154H652M646 149l6 5-6 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sans ent" style="animation-delay:0.29s">
    <rect x="658" y="110" width="170" height="88" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="682" cy="136" r="13" fill="#FBBF24" fill-opacity=".15" stroke="#FBBF24"/>
    <text x="682" y="141" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle">4</text>
    <text x="704" y="142" font-size="18" font-weight="600" fill="#F1F5F9">Staging</text>
    <text x="674" y="178" font-size="14" fill="#94A3B8">acceptance tests</text>
  </g>
  <path d="M834 154H858M852 149l6 5-6 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sans ent" style="animation-delay:0.37s">
    <rect x="864" y="110" width="170" height="88" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="888" cy="136" r="13" fill="#34D399" fill-opacity=".15" stroke="#34D399"/>
    <text x="888" y="141" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">5</text>
    <text x="910" y="142" font-size="18" font-weight="600" fill="#F1F5F9">Production</text>
    <text x="880" y="178" font-size="14" fill="#94A3B8">automated deploy</text>
  </g>
  <path d="M1040 154H1064M1058 149l6 5-6 5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="sans ent" style="animation-delay:0.45s">
    <rect x="1070" y="110" width="170" height="88" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="1094" cy="136" r="13" fill="#22D3EE" fill-opacity=".15" stroke="#22D3EE"/>
    <text x="1094" y="141" font-size="13" font-weight="700" fill="#22D3EE" text-anchor="middle">6</text>
    <text x="1116" y="142" font-size="18" font-weight="600" fill="#F1F5F9">Operations</text>
    <text x="1086" y="178" font-size="14" fill="#94A3B8">monitoring, backup</text>
  </g>
  <rect class="mov" x="40" y="110" width="170" height="88" rx="14" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-width="1.6">
    <animate attributeName="x" values="40;246;452;658;864;1070" dur="7.2s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <g class="sans ent" style="animation-delay:.55s">
    <rect x="40" y="226" width="590" height="226" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="64" y="262" font-size="19" font-weight="700" fill="#F1F5F9">XP day to day</text>
    <text x="606" y="262" font-size="14" fill="#64748B" text-anchor="end">Extreme Programming</text>
    <circle cx="74" cy="294" r="10" fill="#34D399" fill-opacity=".14"/>
    <path d="M69 294l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="300" font-size="16" fill="#CBD5E1">Continuous integration on every change</text>
    <circle cx="74" cy="328" r="10" fill="#34D399" fill-opacity=".14"/>
    <path d="M69 328l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="334" font-size="16" fill="#CBD5E1">Automated tests before every deploy</text>
    <circle cx="74" cy="362" r="10" fill="#34D399" fill-opacity=".14"/>
    <path d="M69 362l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="368" font-size="16" fill="#CBD5E1">Constant refactoring and clean code</text>
    <circle cx="74" cy="396" r="10" fill="#34D399" fill-opacity=".14"/>
    <path d="M69 396l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="402" font-size="16" fill="#CBD5E1">Small, frequent releases</text>
    <circle cx="74" cy="430" r="10" fill="#34D399" fill-opacity=".14"/>
    <path d="M69 430l4 4 7-8" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="436" font-size="16" fill="#CBD5E1">Code, commit and review standards</text>
  </g>
  <g class="sans ent" style="animation-delay:.65s">
    <rect x="650" y="226" width="590" height="226" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="674" y="262" font-size="19" font-weight="700" fill="#F1F5F9">Scrum</text>
    <circle cx="780" cy="352" r="58" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M831 338l7 9 8-8" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="780" y="358" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="middle">sprint</text>
    <g class="mov"><circle cx="780" cy="294" r="7" fill="#A78BFA"/><animateTransform attributeName="transform" type="rotate" from="0 780 352" to="360 780 352" dur="6s" repeatCount="indefinite"/></g>
    <circle cx="878" cy="306" r="5" fill="#A78BFA"/>
    <text x="894" y="312" font-size="16" fill="#CBD5E1">Backlog prioritized with business users</text>
    <circle cx="878" cy="340" r="5" fill="#A78BFA"/>
    <text x="894" y="346" font-size="16" fill="#CBD5E1">Short delivery cycles (sprints)</text>
    <circle cx="878" cy="374" r="5" fill="#A78BFA"/>
    <text x="894" y="380" font-size="16" fill="#CBD5E1">Reviews with the people who use it</text>
    <circle cx="878" cy="408" r="5" fill="#A78BFA"/>
    <text x="894" y="414" font-size="16" fill="#CBD5E1">Retrospectives, continuous improvement</text>
  </g>
</svg>

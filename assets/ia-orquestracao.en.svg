    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <filter id="brilho" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <g id="pacote"><circle r="7" fill-opacity=".5" filter="url(#brilho)"/><circle r="3.2"/></g>

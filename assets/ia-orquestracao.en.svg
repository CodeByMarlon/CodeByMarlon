    <path id="l1" d="M360 235H558"/>
    <path id="l2" d="M360 309C460 309 460 235 558 235"/>
    <path id="m0" d="M722 235C790 235 790 136 858 136"/>
    <path id="m1" d="M722 235C790 235 790 184 858 184"/>
    <path id="m2" d="M722 235C790 235 790 232 858 232"/>
    <path id="m3" d="M722 235C790 235 790 280 858 280"/>

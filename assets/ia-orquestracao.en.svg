<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="titulo desc">
  <title id="titulo">How I work with AI: Claude Code orchestrating subagents and MCP servers</title>
  <desc id="desc">In the center, Claude Code as the orchestrator, with subagents, skills, hooks and memory. On the left, agentic IDEs: TRAE (SOLO mode), Google Antigravity and VS Code. On the right, MCP servers: GitHub, Chrome DevTools, Obsidian, Graphify, Figma, Linear and REA. At the bottom, the delivery flow.</desc>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
    .pill{fill:#0F172A;stroke:#1E293B;stroke-width:1.5}
    .n{font-size:18px;font-weight:600;fill:#E2E8F0}
    .s{font-size:15px;fill:#94A3B8}
    .rot{font-size:13px;font-weight:700;fill:#64748B;letter-spacing:1.6px}
    .fio{fill:none;stroke:#1E3A5F;stroke-width:1.8}
    .ent{animation:ent .8s ease-out both}
    .e1{animation-delay:.05s}.e2{animation-delay:.2s}.e3{animation-delay:.35s}.e4{animation-delay:.5s}
    @keyframes ent{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.ent{animation:none}.mov{display:none}}
  </style>

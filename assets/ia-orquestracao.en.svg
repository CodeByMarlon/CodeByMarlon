    <text x="1222" y="285" class="s" font-size="14.5" text-anchor="end">code graph · impact</text>
    <rect x="860" y="308" width="380" height="40" rx="20" class="pill"/>
    <circle cx="882" cy="328" r="7" fill="#F472B6"/><text x="900" y="334" class="n" font-size="17">Figma</text>
    <text x="1222" y="333" class="s" font-size="14.5" text-anchor="end">design → code</text>
    <rect x="860" y="356" width="380" height="40" rx="20" class="pill"/>
    <circle cx="882" cy="376" r="7" fill="#818CF8"/><text x="900" y="382" class="n" font-size="17">Linear</text>
    <text x="1222" y="381" class="s" font-size="14.5" text-anchor="end">tasks · roadmap</text>
    <rect x="860" y="404" width="380" height="40" rx="20" class="pill" style="stroke:#F87171;stroke-opacity:.5"/>
    <circle cx="882" cy="424" r="7" fill="#F87171"/><text x="900" y="430" class="n" font-size="17">REA</text>
    <text x="1222" y="429" class="s" font-size="14.5" text-anchor="end">reverse engineering · decompilation</text>
  </g>
